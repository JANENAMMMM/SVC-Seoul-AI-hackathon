<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여행 일정 카드</title>
<style>
  /* 1080×1350 (4:5) 카드. 노인 친화: 본문 최소 34px, 대비 7:1 이상, 한 줄 한 정보 */
  :root {
    --brand: #5e2bb8; --brand-dark: #3f1c82; --brand-soft: #f3edfc;
    --ink: #1a1a1a; --text: #2b2b2b; --muted: #55505f;
    --canvas: #fbf8f2; --line: #e3dcec; --accent: #b4491f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; }
  body { font-family: "Pretendard", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; background: var(--canvas); color: var(--text); word-break: keep-all; }
  .card { width: 1080px; height: 1350px; display: flex; flex-direction: column; }

  .hero { position: relative; height: 560px; flex: none; background: #222 center/cover no-repeat; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.05) 35%, rgba(20,8,45,.82) 100%); }
  .hero > * { position: relative; z-index: 1; }
  .badge { position: absolute; left: 56px; top: 48px; background: var(--brand); color: #fff; font-size: 44px; font-weight: 800; padding: 12px 34px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .hero-text { position: absolute; left: 56px; right: 56px; bottom: 40px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .date { font-size: 38px; font-weight: 600; opacity: .95; }
  h1 { font-size: 76px; line-height: 1.18; font-weight: 800; margin-top: 8px; letter-spacing: -1px; }
  .credit { position: absolute; right: 20px; top: 14px; font-size: 18px; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.7); max-width: 560px; text-align: right; }

  .stops { flex: 1; padding: 36px 56px 0; display: flex; flex-direction: column; gap: 0; }
  .stop { display: grid; grid-template-columns: 250px 1fr; align-items: center; column-gap: 24px; padding: 20px 0; border-bottom: 2px solid var(--line); flex: 1; }
  .stop:last-child { border-bottom: 0; }
  .time { font-size: 44px; font-weight: 800; color: var(--brand); line-height: 1.15; white-space: nowrap; }
  .time small { display: block; font-size: 30px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .place { font-size: 50px; font-weight: 800; color: var(--ink); line-height: 1.2; }
  .desc { font-size: 34px; line-height: 1.4; color: var(--text); margin-top: 6px; }

  .foot { flex: none; margin: 0 56px 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .foot div { background: var(--brand-soft); border: 2px solid var(--line); border-radius: 22px; padding: 18px 26px; }
  .foot b { display: block; font-size: 30px; color: var(--brand-dark); font-weight: 700; }
  .foot span { display: block; font-size: 38px; font-weight: 800; color: var(--ink); margin-top: 2px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hero" id="hero">
    <div class="badge" id="badge"></div>
    <div class="credit" id="credit"></div>
    <div class="hero-text"><div class="date" id="date"></div><h1 id="title"></h1></div>
  </div>
  <div class="stops" id="stops"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
  // 렌더 스크립트가 window.CARD = { day, date, title, photo, credit, stops:[{time,place,desc}], meal, stay } 를 주입합니다.
  const c = window.CARD || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
  $("hero").style.backgroundImage = c.photo ? `url("${c.photo}")` : "";
  $("badge").textContent = `${c.day}일차`;
  $("date").textContent = c.date || "";
  $("title").textContent = c.title || "";
  $("credit").textContent = c.credit ? `사진: ${c.credit}` : "";
  $("stops").innerHTML = (c.stops || []).map((s) => `
    <div class="stop">
      <div class="time">${esc(s.time)}</div>
      <div><div class="place">${esc(s.place)}</div><div class="desc">${esc(s.desc)}</div></div>
    </div>`).join("");
  $("foot").innerHTML = `<div><b>오늘의 식사</b><span>${esc(c.meal)}</span></div><div><b>오늘 묵는 곳</b><span>${esc(c.stay)}</span></div>`;
</script>
</body>
</html>
