[project]
name = "bangeoreum"
version = "0.1.0"
description = "반걸음 — 효도여행 설계 도우미 백엔드"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
