<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5e2bb8"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="120" y="150" font-size="30" fill="#5e2bb8" font-weight="700" text-anchor="start">자녀 · 부모님</text>
<text x="120" y="232" font-size="60" fill="#111111" font-weight="800" text-anchor="start">의견은 미리보기로, 승인해야 바뀝니다</text>
<rect x="120" y="330" width="480" height="300" rx="28" fill="#ffffff" stroke="#5e2bb8" stroke-width="4"/>
<circle cx="190" cy="400" r="34" fill="#5e2bb8"/>
<text x="190" y="412" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle">1</text>
<text x="240" y="412" font-size="26" fill="#5e2bb8" font-weight="700" text-anchor="start">사람</text>
<text x="160" y="515" font-size="44" fill="#111111" font-weight="800" text-anchor="start">의견 또는 버튼</text>
<text x="160" y="570" font-size="28" fill="#5b6070" font-weight="400" text-anchor="start">"엄마가 2일차</text>
<text x="160" y="610" font-size="28" fill="#5b6070" font-weight="400" text-anchor="start">힘들대요"</text>
<rect x="720" y="330" width="480" height="300" rx="28" fill="#5e2bb8" stroke="#5e2bb8" stroke-width="4"/>
<circle cx="790" cy="400" r="34" fill="#ffffff"/>
<text x="790" y="412" font-size="34" fill="#5e2bb8" font-weight="800" text-anchor="middle">2</text>
<text x="840" y="412" font-size="26" fill="#ffffff" font-weight="700" text-anchor="start">AI</text>
<text x="760" y="515" font-size="44" fill="#ffffff" font-weight="800" text-anchor="start">일정 다시 짜기</text>
<text x="760" y="570" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">말을 수정 명령으로 바꾸고</text>
<text x="760" y="610" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">엔진이 새 일정 계산</text>
<rect x="1320" y="330" width="480" height="300" rx="28" fill="#ffffff" stroke="#5e2bb8" stroke-width="4"/>
<circle cx="1390" cy="400" r="34" fill="#5e2bb8"/>
<text x="1390" y="412" font-size="34" fill="#ffffff" font-weight="800" text-anchor="middle">3</text>
<text x="1440" y="412" font-size="26" fill="#5e2bb8" font-weight="700" text-anchor="start">사람</text>
<text x="1360" y="515" font-size="44" fill="#111111" font-weight="800" text-anchor="start">자녀 승인</text>
<text x="1360" y="570" font-size="28" fill="#5b6070" font-weight="400" text-anchor="start">바뀐 점 미리보기</text>
<text x="1360" y="610" font-size="28" fill="#5b6070" font-weight="400" text-anchor="start">승인 전엔 그대로</text>
<path d="M610,480 H708" stroke="#5e2bb8" stroke-width="6" fill="none" marker-end="url(#ar)"/>
<path d="M1210,480 H1308" stroke="#5e2bb8" stroke-width="6" fill="none" marker-end="url(#ar)"/>
<rect x="120" y="720" width="1680" height="210" rx="24" fill="#f6f2fb"/>
<text x="170" y="790" font-size="28" fill="#5e2bb8" font-weight="700" text-anchor="start">예시</text>
<text x="170" y="842" font-size="32" fill="#111111" font-weight="500" text-anchor="start">그날 오행산 '표준 관람' → '엘리베이터·사원 일부' 코스</text>
<text x="170" y="886" font-size="32" fill="#111111" font-weight="500" text-anchor="start">용다리·대성당도 짧은 코스로 바뀌고, 하루 난이도를 전후로 비교합니다.</text>
<text x="120" y="1000" font-size="28" fill="#5b6070" font-weight="400" text-anchor="start">조정 1회 1원 미만 (버튼은 0원) · 개인 의견은 그 여행만 바꿉니다</text>
</svg>